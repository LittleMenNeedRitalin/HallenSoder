name: Deploy till GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publicera Blazor WebAssembly
        run: dotnet publish HallenSoder/HallenSoder.Client/HallenSoder.Client.csproj -c Release -o release --nologo

      - name: Sätt base href och SPA-fallback
        run: |
          # Egen domän (CNAME-fil i wwwroot) => "/", annars projektadress => "/<repo>/"
          if [ -f release/wwwroot/CNAME ]; then
            BASE="/"; SEGMENTS=0
          else
            BASE="/${GITHUB_REPOSITORY#*/}/"; SEGMENTS=1
          fi
          sed -i "s|<base href=\"/\" />|<base href=\"${BASE}\" />|" release/wwwroot/index.html
          sed -i "s|var pathSegmentsToKeep = 0;|var pathSegmentsToKeep = ${SEGMENTS};|" release/wwwroot/404.html
          touch release/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
